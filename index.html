<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ian Madez | Portfolio</title>
    <!-- We will use a standard serif that mimics the SCE font -->
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <!-- Global CRT / Grain Overlay -->
    <div class="crt-grain"></div>
    <div class="crt-scanlines"></div>

    <!-- Mobile Orientation Toast -->
    <div id="orientation-toast" class="hidden">
        <i class="fas fa-mobile-alt rotate-icon"></i>
        <p>Rotate for the best experience. Tap PS to enter fullscreen.</p>
        <button id="dismiss-toast">✕</button>
    </div>

    <!-- PHASE 1: BOOT SEQUENCE -->
    <div id="boot-container">
        <!-- Three.js Canvas will inject here -->
        <canvas id="boot-canvas"></canvas>
        
        <!-- The Dramatic Text Slam -->
        <div id="boot-text-container" class="hidden">
            <h1 class="sce-font glow">IAN MADEZ©</h1>
            <p class="sce-subfont fade-in">Design Engineer</p>
        </div>

        <!-- Start Button (Browsers block auto-playing audio, so we need a click to start) -->
        <img src="assets/images/ui/ps-logo.svg" id="power-button" alt="Boot Console" class="ps-power-logo">
    </div>

    <!-- GSAP for buttery UI animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Three.js for the 3D Towers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="assets/js/three-boot.js"></script>
    <script src="assets/js/three-system-config.js"></script>
    <script src="assets/js/core/audio-manager.js"></script>
    <script src="assets/js/core/app-state.js"></script>
    <script src="assets/js/data/projects.js"></script>
    <script src="assets/js/ui/dev-toast.js"></script>
    <script src="assets/js/ui/mobile-orientation.js"></script>
    <script src="assets/js/ui/boot-ui.js"></script>
    <script src="assets/js/ui/browser-ui.js"></script>
    <script src="assets/js/ui/memory-card-ui.js"></script>
    <script src="assets/js/ui/project-detail-ui.js"></script>
    <script src="assets/js/ui/system-config-ui.js"></script>
    <script src="assets/js/three-version.js"></script>
    <script src="assets/js/ui/version-info-ui.js"></script>
    <script src="assets/js/core/command-mapper.js"></script>
    <script src="assets/js/core/app-controller.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
